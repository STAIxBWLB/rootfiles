extends: minimal

users:
  home_base: /raid/home
  default_groups:
    - sudo
    - docker

modules:
  docker:
    enabled: true
    storage_dir: /raid/docker
  nvidia:
    enabled: true
    persistenced: true
    fabric_manager: true   # NVSwitch systems (DGX A100/H100/H200)
    gpu_allocation:
      enabled: true
      method: both
  cloudflared:
    enabled: true
    # The tunnel's private VLAN is site-specific: set
    # modules.cloudflared.private_network in a site config that extends dgx.
  storage:
    enabled: true
    data_dir: /raid/data
    symlinks:
      /data: /raid/data
  network:
    enabled: true
    ufw: true
    allowed_ports:
      - 80
      - 443

ssh:
  disable_password_auth: true
