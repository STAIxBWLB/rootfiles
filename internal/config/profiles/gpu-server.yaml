extends: minimal

users:
  default_groups:
    - sudo
    - docker

modules:
  docker:
    enabled: true
  nvidia:
    enabled: true
    persistenced: true
    gpu_allocation:
      enabled: true
      method: env
  cloudflared:
    enabled: true
  storage:
    enabled: true
  network:
    enabled: true
    ufw: true

ssh:
  disable_password_auth: true
