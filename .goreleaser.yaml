version: 2

builds:
  - main: ./cmd/rootfiles
    binary: rootfiles
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
    env:
      - CGO_ENABLED=0

archives:
  - format: tar.gz
    name_template: "rootfiles_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  # Release notes come from docs/releases/<tag>.md (--release-notes).
  disable: true

release:
  github:
    owner: STAIxBWLB
    name: rootfiles
  extra_files:
    - glob: scripts/install.sh
