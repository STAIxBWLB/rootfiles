name: Test

on:
  push:
    branches: [main]
  # No `paths` filter: the decision job skips the expensive jobs when only
  # non-test files changed, so every commit still gets a Test result that the
  # Release workflow can check. Tags are not tested again.
  pull_request:
    branches: [main]

concurrency:
  # One group per main commit: a newer push would otherwise replace a pending
  # main run, and Release needs every main commit's Test result.
  group: rootfiles-test-${{ github.event_name == 'push' && github.sha || github.ref }}
  # Main pushes are never cancelled: every main commit needs a Test result for Release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOMAXPROCS: "2"
  GOFLAGS: "-p=1"

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run_full: ${{ steps.decide.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_FILE: test.yaml
          # The former trigger paths filter plus README.md (monitoring_hub_test reads it).
          # docs/releases/ holds release notes only.
          TEST_INPUTS: '^(cmd/|internal/|profiles/|templates/|scripts/|tests/|go\.mod$|go\.sum$|Makefile$|\.github/workflows/|\.goreleaser\.yaml$|README\.md$)'
          TEST_IGNORE: '^docs/releases/'
        run: bash scripts/ci-decision.sh

  lint:
    needs: decision
    if: needs.decision.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: CI decision path classification
        run: bash scripts/ci-decision.sh --self-test
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo ""
            echo "::group::gofmt diff"
            gofmt -d .
            echo "::endgroup::"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: darwin build (read-only commands on operator laptops)
        run: |
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=darwin GOARCH=arm64 go build ./...
      - name: go mod tidy drift
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod or go.sum is out of date. Run 'go mod tidy' and commit the result."
            exit 1
          fi

  vuln:
    needs: decision
    if: needs.decision.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  unit:
    needs: decision
    if: needs.decision.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Run unit tests
        run: ROOTFILES_MONITORING_SCENARIO_DIR="$PWD/hub-fixtures" go test ./... -race -count=1 -coverprofile=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-hub-fixtures
          path: hub-fixtures
          include-hidden-files: true
      - name: Coverage summary
        run: |
          echo "::group::Per-function coverage"
          go tool cover -func=coverage.out
          echo "::endgroup::"
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "Total coverage: $total"
          echo "### Coverage: $total" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
      - name: Build binary
        run: CGO_ENABLED=0 go build -o bin/rootfiles ./cmd/rootfiles/
      - name: Verify CLI help
        run: ./bin/rootfiles --help
      - uses: actions/upload-artifact@v4
        with:
          name: rootfiles-binary
          path: bin/rootfiles

  integration:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # Ubuntu 22.04 × profiles
          - os: ubuntu-22.04
            profile: base
          - os: ubuntu-22.04
            profile: minimal
          - os: ubuntu-22.04
            profile: gpu-server
          - os: ubuntu-22.04
            profile: full
          # Ubuntu 24.04 × profiles
          - os: ubuntu-24.04
            profile: base
          - os: ubuntu-24.04
            profile: minimal
          - os: ubuntu-24.04
            profile: gpu-server
          - os: ubuntu-24.04
            profile: full
          # DGX mock × profiles
          - os: dgx-22.04
            profile: minimal
          - os: dgx-22.04
            profile: dgx
          - os: dgx-22.04
            profile: full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rootfiles-binary
          path: .
      - name: Make binary executable
        run: chmod +x rootfiles
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build test image
        run: |
          docker buildx build --load \
            --cache-from "type=gha,scope=img-${{ matrix.os }}" \
            --cache-to "type=gha,mode=max,scope=img-${{ matrix.os }}" \
            -t rootfiles-test:${{ matrix.os }} -f tests/integration/Dockerfile.${{ matrix.os }} .
      - name: Run integration test
        run: |
          docker run --rm --privileged \
            -e ROOTFILES_YES=true \
            -e ROOTFILES_PROFILE=${{ matrix.profile }} \
            -e ROOTFILES_USER=testuser \
            -e ROOTFILES_TUNNEL_TOKEN=test-token-dummy \
            -e ROOTFILES_VLAN_ADDRESS=172.16.0.1/32 \
            -e ROOTFILES_HOME_BASE=/raid/home \
            rootfiles-test:${{ matrix.os }} \
            /tests/run-profile.sh ${{ matrix.profile }}

  module:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        module: [locale, system, packages, ssh, users, security, cloudflared, storage, network, gpu]
        os: [ubuntu-22.04, ubuntu-24.04]
        exclude:
          # GPU module needs nvidia-smi mock + fake /dev/nvidia*, only available in dgx image
          - module: gpu
            os: ubuntu-22.04
          - module: gpu
            os: ubuntu-24.04
        include:
          - module: gpu
            os: dgx-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rootfiles-binary
          path: .
      - name: Make binary executable
        run: chmod +x rootfiles
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build test image
        run: |
          docker buildx build --load \
            --cache-from "type=gha,scope=img-${{ matrix.os }}" \
            --cache-to "type=gha,mode=max,scope=img-${{ matrix.os }}" \
            -t rootfiles-test:${{ matrix.os }} -f tests/integration/Dockerfile.${{ matrix.os }} .
      - name: Test single module
        run: |
          docker run --rm --privileged \
            -e ROOTFILES_YES=true \
            -e ROOTFILES_USER=testuser \
            -e ROOTFILES_HOME_BASE=/raid/home \
            rootfiles-test:${{ matrix.os }} \
            /tests/run-module.sh ${{ matrix.module }}

  scenario:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scenario:
          - dry-run-all-profiles
          - user-backup-restore
          - user-rehome
          - user-list-names
          - tunnel-setup-teardown
          - os-reinstall-recovery
          - system-backup
          - gpu-allocation
          - status
          - ssh-lockout-guard
          - declarative-accounts
          - state-rollback-lock
          - user-lifecycle
          - user-quota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rootfiles-binary
          path: .
      - name: Make binary executable
        run: chmod +x rootfiles
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build test image
        run: |
          docker buildx build --load \
            --cache-from "type=gha,scope=img-dgx-22.04" \
            --cache-to "type=gha,mode=max,scope=img-dgx-22.04" \
            -t rootfiles-test:dgx-22.04 -f tests/integration/Dockerfile.dgx-22.04 .
      - name: Load quota kernel modules
        if: matrix.scenario == 'user-quota'
        # Containers share the host kernel; without quota_v2 the scenario
        # can only check the refusal path, not enforcement. On Azure runner
        # kernels the module is only in linux-modules-extra.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || true
          sudo modprobe -a quota_v2 quota_tree || true
          lsmod | grep -E '^quota_(v2|tree)' || echo "::warning::quota_v2 unavailable; quota enforcement not tested"
      - name: Run scenario
        run: |
          docker run --rm --privileged \
            -e ROOTFILES_YES=true \
            rootfiles-test:dgx-22.04 \
            /tests/scenarios/${{ matrix.scenario }}.sh

  fleet-scenario:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rootfiles-binary
          path: .
      - name: Verify fleet against two SSH containers
        run: |
          chmod +x rootfiles
          ROOTFILES_TEST_BINARY="$PWD/rootfiles" bash tests/scenarios/fleet.sh

  rocky:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [rocky-8.9, rocky-8.10, rocky-9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rootfiles-binary
          path: .
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build pinned Rocky fixture
        run: |
          chmod +x rootfiles
          docker buildx build --load \
            --cache-from "type=gha,scope=rocky-${{ matrix.os }}" \
            --cache-to "type=gha,mode=max,scope=rocky-${{ matrix.os }}" \
            -t rootfiles-test:${{ matrix.os }} -f tests/integration/Dockerfile.${{ matrix.os }} .
      - name: Verify native Rocky core profile, SSH and installer
        run: bash tests/run-rocky.sh rootfiles-test:${{ matrix.os }}

  monitoring-hub:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rootfiles-binary
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: monitoring-hub-fixtures
          path: hub-fixtures
      - name: Validate generated hub configs, targets and alert delivery
        run: |
          chmod +x rootfiles
          bash tests/scenarios/monitoring-hub.sh "$PWD/hub-fixtures"
